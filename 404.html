<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The requested page could not be found. Return to loyeh's Oasis.">
    <title>404 | loyeh の Oasis</title>
    <link rel="stylesheet" href="/css/404.css">
    <script src="/js/404.js" defer></script>
</head>

<body>
    <div id="scene-loader" class="scene-loader" aria-hidden="true">
        <span class="scene-loader__dot"></span>
        <span class="scene-loader__dot"></span>
    </div>
    <main id="not-found" class="not-found" aria-labelledby="not-found-title">
        <div class="sky-bg" aria-hidden="true"></div>
        <div class="wave-7" aria-hidden="true"></div>
        <div class="wave-6" aria-hidden="true"></div>
        <a href="/" class="wave-island" aria-label="Return to the home page">
            <img src="/medias/island.svg" alt="">
        </a>
        <div class="wave-5" aria-hidden="true"></div>
        <div class="wave-lost" aria-hidden="true">
            <span>4</span>
            <span>0</span>
            <span>4</span>
        </div>
        <div class="wave-4" aria-hidden="true"></div>
        <div class="wave-boat" aria-hidden="true">
            <img class="boat" src="/medias/boat.svg" alt="">
        </div>
        <div class="wave-3" aria-hidden="true"></div>
        <div class="wave-2" aria-hidden="true"></div>
        <div class="wave-1" aria-hidden="true"></div>
        <div class="wave-message">
            <h1 id="not-found-title">Page not found</h1>
            <p>Click on the <span class="highlight">Island</span> to return</p>
        </div>
    </main>
</body>

</html>
